{# Sidebar update badge (base.html), polled from /api/updates/indicator. Renders a small dot only
   when an update is available; empty otherwise (the poll target simply stays blank). #}
{% if available %}
<a href="/settings" class="flex items-center gap-1.5 text-[10px] text-accent hover:opacity-80"
   title="{{ behind }} update{{ '' if behind == 1 else 's' }} available — open Settings">
  <span class="w-1.5 h-1.5 rounded-full bg-accent shrink-0"></span>update available
</a>
{% endif %}
