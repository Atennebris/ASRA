[package]
name = "asra-desktop"
version = "0.7.0"
edition = "2021"
description = "ASRA desktop shell — native window over the local FastAPI web UI"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
getrandom = "0.2"
tauri-plugin-notification = "2"
# Native "choose a folder" dialog for bootstrap_full_project (main.rs) -- an operator who only
# downloaded the standalone exe (no repo) picks where the full ASRA project gets installed.
tauri-plugin-dialog = "2"
# Local-time-with-UTC-offset timestamps for this shell's own debug.log lines (see
# append_desktop_log_line in main.rs) -- matches agent/utils/debug.py's own format exactly, so the
# same tailing console/window reads both without a second parser.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1.0.154"

# Windows-only -- mem_bridge.rs itself is already `#[cfg(windows)] mod mem_bridge;` in main.rs, but
# a plain [dependencies] entry still gets resolved/compiled for EVERY target regardless of that
# cfg-gating (confirmed live: a native Linux build of this same crate failed to compile `windows`'s
# own transitive dependencies, which don't fully support a non-Windows host). A target-specific
# dependency table is what actually skips it on Linux/macOS builds.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_Debug"] }
